version: '3'

services:
  xchain_encoder:
    build: .
    # Docker's own init as PID 1, on top of the image's tini ENTRYPOINT, the
    # same tree xchain-node's `docker run --init` gives production:
    # docker-init -> tini -> node. docker-init reaps zombies left by
    # healthcheck probes (node never reaps orphaned children), and SIGTERM
    # reaches node forwarded through both inits.
    init: true
    # The image bakes no .env (Dockerfile); the README's .env is handed to the
    # container here instead.
    env_file: .env
    # HARD CONSTRAINT: exactly one encoder replica per endpoint. The UTXO
    # outpoint-reservation double-spend guard, the recent-build duplicate
    # refusal, the envelope-cancel owner set, the reservation tickets, the rate
    # limiter and the concurrency-gate counters are all in-process
    # (src/server/single_instance_guard.js); scaling out lets two replicas build
    # PSBTs spending the same UTXO and lets one byte-identical transaction be built
    # once per replica. If a deploy manifest ever sets a replica count, mirror
    # it in ENCODER_REPLICAS so boot fails loudly.
    deploy:
      replicas: 1
    networks: 
      - network1
    ports:
      - "3002:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "10"
        
networks:
  network1:
    name: xchain_network
    external: true